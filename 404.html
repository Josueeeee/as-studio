<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada · as studio</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/as-studio/assets/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700;800&display=swap" rel="stylesheet">
<style>
  :root{--morado:#5B2DFF;--amarillo:#FFC31D;--coral:#FE5B3C;--crema:#FAF7F2}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100svh;display:grid;place-items:center;text-align:center;padding:32px 16px;font-family:Poppins,system-ui,sans-serif;background:var(--morado);color:var(--crema);overflow:hidden;position:relative}
  .b{position:absolute;border-radius:50%}
  img{width:min(50vw,200px);height:auto;margin:0 auto 28px;display:block}
  h1{font-size:clamp(2.2rem,7vw,4rem);font-weight:300;line-height:1.05;letter-spacing:-.02em}
  h1 strong{display:block;font-weight:800;color:var(--amarillo)}
  p{margin:18px 0 32px;opacity:.85}
  a{display:inline-flex;align-items:center;min-height:48px;padding:12px 28px;border-radius:999px;background:var(--amarillo);color:var(--morado);font-weight:700;text-decoration:none}
  a:focus-visible{outline:3px solid var(--crema);outline-offset:4px}
  main{position:relative;z-index:1}
</style>
</head>
<body>
<span class="b" style="width:220px;height:220px;right:-80px;top:-80px;background:var(--amarillo)" aria-hidden="true"></span>
<span class="b" style="width:260px;height:260px;left:-110px;bottom:-110px;background:var(--coral)" aria-hidden="true"></span>
<main>
  <img src="/as-studio/assets/mark-light.png" alt="as studio" width="396" height="288">
  <h1>Esta página <strong>no existe.</strong></h1>
  <p>Pero tu próxima idea sí puede tomar color.</p>
  <a href="/as-studio/">Volver al inicio</a>
</main>
</body>
</html>
